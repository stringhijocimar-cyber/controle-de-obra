name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Conferir Android SDK 35
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintRelease
      - name: Preparar instalador
        run: cp app/build/outputs/apk/debug/app-debug.apk ObraControl-2.8.0-Testes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ObraControl-Android
          path: ObraControl-2.8.0-Testes.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ObraControl-Release-Base
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testar tabelas, parcelamento, Gantt e backup no Android
        uses: ReactiveCircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -noaudio -no-snapshot
          script: |
            adb shell wm size 1080x2400
            adb shell wm density 440
            bash scripts/capture-android-tables.sh
      - name: Guardar capturas das tabelas de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Capturas-Android
          path: app/build/ui-screenshots/screenshots.tar
          if-no-files-found: warn
      - name: Guardar diagnóstico se um teste Android falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostico-Android
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: ignore
