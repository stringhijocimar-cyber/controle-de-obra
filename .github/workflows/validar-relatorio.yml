name: Validar pagamentos e PDF 2.6.0
on:
  push:
    branches: [codex/validar-relatorio-2.6.0]
permissions:
  contents: read
jobs:
  pagamentos-relatorio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar testes antes do emulador
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Preparar diagnostico
        run: |
          cat > /tmp/validate-260.sh <<'SH'
          #!/usr/bin/env bash
          set +e
          mkdir -p app/build/ui-screenshots
          capture() {
            local phase="$1"
            app_pid=$(adb shell pidof br.com.obracontrol.app | tr -d '\r')
            if [[ -n "$app_pid" ]]; then adb shell run-as br.com.obracontrol.app kill -3 "$app_pid"; fi
            adb logcat -d -t 2500 > "app/build/ui-screenshots/logcat-$phase.txt"
            adb exec-out screencap -p > "app/build/ui-screenshots/screen-$phase.png"
            timeout 20s adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml "app/build/ui-screenshots/window-$phase.xml"
            adb exec-out run-as br.com.obracontrol.app tar -C files -cf - screenshots > "app/build/ui-screenshots/screenshots-$phase.tar"
          }
          adb shell wm size 1080x2400
          adb shell wm density 440
          timeout --kill-after=15s 150s ./gradlew :app:connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=br.com.obracontrol.ReportTablesFlowTest,br.com.obracontrol.PaymentOrganizationFlowTest#reportContainsMonthlyCalendarAndEveryAgendaEntryWithRepeatedPageHeaders'
          report_result=$?
          capture pdf
          adb shell am force-stop br.com.obracontrol.app
          timeout --kill-after=15s 150s ./gradlew :app:connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=br.com.obracontrol.PaymentOrganizationFlowTest#categoryFiltersApplyToAllPaymentViewsWhileOverallTotalsStayVisibleAndDataIsPreserved'
          ui_result=$?
          capture ui
          echo "PDF result: $report_result / UI result: $ui_result"
          [[ "$report_result" -eq 0 && "$ui_result" -eq 0 ]]
          SH
      - name: Preparar emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Conferir PDF e depois navegacao
        uses: ReactiveCircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -noaudio -no-snapshot
          script: bash /tmp/validate-260.sh
      - name: Guardar PDFs capturas e diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Validacao-Pagamentos-PDF
          path: |
            app/build/ui-screenshots/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
