name: Diagnosticar Gantt
on:
  push:
    branches: [codex/validar-relatorio-2.6.0]
permissions:
  contents: read
jobs:
  gantt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Preparar teste
        run: |
          cat > /tmp/gantt.sh <<'SH'
          #!/usr/bin/env bash
          set +e
          adb shell wm size 1080x2400
          adb shell wm density 440
          timeout 120s ./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pandroid.testInstrumentationRunnerArguments.class=br.com.obracontrol.GanttFlowTest
          result=$?
          mkdir -p app/build/ui-screenshots
          adb exec-out run-as br.com.obracontrol.app tar -C files -cf - screenshots > app/build/ui-screenshots/screenshots.tar
          exit "$result"
          SH
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -noaudio -no-snapshot
          script: bash /tmp/gantt.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Gantt-Diagnostico
          path: |
            app/build/ui-screenshots/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
